
name: Inspect ExecuTorch iOS

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Inspect iOS project
        run: |
          xcodebuild -version
          echo "DEMO FILES:"
          ls -la mv3/apple/ExecuTorchDemo
          echo "XCODE PROJECTS:"
          find mv3/apple -maxdepth 5 \
            \( -name "*.xcodeproj" \
            -o -name "*.xcworkspace" \
            -o -name "Package.swift" \) \
            -print

