name: LungCAD synthetic model export validation
on:
  workflow_dispatch:
  push:
    paths: ['lungcad/scripts/export_model.py', '.github/workflows/lungcad-model.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned export environment
        run: |
          python -m pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install monai==1.4.0 numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
      - name: Export pretrained model and compare synthetic outputs
        run: python lungcad/scripts/export_model.py --output "$RUNNER_TEMP/model"
      - uses: actions/upload-artifact@v4
        with:
          name: LungCAD-experimental-model-synthetic-parity-only
          path: |
            ${{ runner.temp }}/model/lungcad.onnx
            ${{ runner.temp }}/model/lungcad.json
            ${{ runner.temp }}/model/validation.json
            ${{ runner.temp }}/model/LICENSE
            ${{ runner.temp }}/model/uniform-*
          if-no-files-found: error
  simulator-inference:
    needs: export
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LungCAD-experimental-model-synthetic-parity-only
          path: lungcad/IntegrationTests/Model
      - run: brew install xcodegen
      - name: Generate project
        working-directory: lungcad
        run: xcodegen generate
      - name: Run native synthetic inference on iPad simulator
        working-directory: lungcad
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPad" in x["name"]))')
          xcodebuild test -project LungCAD.xcodeproj -scheme LungCAD \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Inference.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/inference.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LungCAD-native-synthetic-inference-results
          path: |
            ${{ runner.temp }}/Inference.xcresult
            ${{ runner.temp }}/inference.log
