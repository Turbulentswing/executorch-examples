name: LungCAD
options:
  bundleIdPrefix: org.lungcad.research
  deploymentTarget:
    iOS: "17.0"
packages:
  LungCADCore:
    path: .
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  LungCAD:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LungCADCore
      - package: ONNXRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lungcad.research.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  LungCADIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
        excludes: [Model]
      - path: IntegrationTests/Model
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: LungCAD
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LungCAD:
    build:
      targets:
        LungCAD: all
    test:
      targets: [LungCADIntegrationTests]
